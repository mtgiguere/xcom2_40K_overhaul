[Astartes.X2DownloadableContentInfo_Astartes]
DLCIdentifier="Astartes"
; Soldier classes this mod defines (roster order). Must match tests/data/class_trees.json.
+MarineClasses="Astartes_Tactical"
+MarineClasses="Astartes_Assault"
+MarineClasses="Astartes_Devastator"
+MarineClasses="Astartes_Apothecary"
+MarineClasses="Astartes_Librarian"

; Gender policy. Lore default: Space Marines are male. true = the generator may roll female Marines
; (they wear whatever female-compatible armour exists, which today means XCOM gear).
bAllowFemaleMarines=false

; Body-part packs (DLCName values) the Marine look is drawn from, when installed.
; Space Marine 2 Tacticus Armor (Workshop 3457562492). Empty list = vanilla random appearance.
+MarineArmorPartPacks="SM2Tacticus"
; Only parts whose name contains one of these keywords are used. The Space Marine 2 packs label every tintable
; piece "(Tintable)" / "(Primary Tint)" / "(Secondary Tint)"; unlabelled pieces are pre-painted for one Chapter
; (Deathwatch arms, Ultramarines sergeant pads...) and would clash with the campaign's livery.
+MarinePartNameKeywords="Tint"

; The Chapter = the recruits' country (flag, name list, livery). Country templates come from the chapter flag
; mods (AddUltramarines, AddBloodAngels, AddLoyalistLegions...). Override per campaign with the console:
;   Astartes_Chapter Country_BloodAngels
; '' = vanilla random countries. Falls back to vanilla if the flag mod is not enabled.
ChapterCountry="Country_Ultramarines"
; Chapter-flag countries ship no name lists; names come from this country instead.
NameFallbackCountry="Country_UK"

; Armour palette indices per Chapter. -1 = leave the generator's random colour. Tune in game with:
;   Astartes_Livery <primary> <secondary>      (applies to the whole barracks immediately)
; The armour parts split across both tint channels, so a uniform Chapter colour needs the same index on both.
; Indices below are first guesses; the vanilla palette has ~ 70 entries. Playtest 2026-10-17: 14 = blue, 19 = yellow, 2 = blue, 10 = red.
+ChapterLiveries=(Country="Country_Ultramarines",  PrimaryTint=14, SecondaryTint=14)
+ChapterLiveries=(Country="Country_BloodAngels",   PrimaryTint=10, SecondaryTint=10)
+ChapterLiveries=(Country="Country_ImperialFists", PrimaryTint=19, SecondaryTint=19)
+ChapterLiveries=(Country="Country_DarkAngels",    PrimaryTint=20, SecondaryTint=20)
+ChapterLiveries=(Country="Country_Salamanders",   PrimaryTint=22, SecondaryTint=22)
+ChapterLiveries=(Country="Country_SpaceWolves",   PrimaryTint=27, SecondaryTint=27)
+ChapterLiveries=(Country="Country_BlackTemplars", PrimaryTint=1,  SecondaryTint=1)

; Run order (Community Highlander): after the faction mods so we can strip their raid SitReps, and before
; Primary Secondaries (which is RUN_LAST) so it sees our swords and pistols and makes _Primary variants.
[Astartes CHDLCRunOrder]
RunPriorityGroup=RUN_STANDARD
+RunAfter="OrkRaiders"
+RunAfter="BlackLegion"
+RunAfter="DarkEldar_Raiders"
+RunBefore="PrimarySecondaries"

; Community Highlander dependency declaration (shows an in-game warning if a required mod is missing)
[Astartes CHModDependency]
DisplayName="XCOM 2: Warhammer 40K Overhaul"
+RequiredMods="X2WOTCCommunityHighlander"
; Primary Secondaries (Workshop 1142234205): primary swords and pistols for Assault Marines and Librarians.
+RequiredMods="PrimarySecondaries"
