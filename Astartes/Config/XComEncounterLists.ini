; Astartes spawn lists. These are our own leader/follower lists so a faction can cover the whole
; force-level range even when the source mod's lists start late. Templates that are not loaded
; (mod disabled) are skipped by the pod builder, so vanilla Chryssalid/Faceless keep Tyranid
; continents at least thematically right without The Hive.
;
; Tyranids (The Hive mod = Genestealer Cult + swarm):
;   FL 1-4   Genestealer Cult: our weak hybrid variant (Astartes_CultHybrid), infiltrators (Faceless), a few purestrains
;   FL 5-9   full-strength hybrids (ChrysHybrid), rippers (CXRipperM1), drones (CXDrone), zombies (ChrysZombie)
;   FL 10+   the swarm: infectors, chameleons, brood mothers, warriors, shriekers, hive guard, juvenile queens
[XComGame.XComTacticalMissionManager]
+SpawnDistributionLists=(ListID="Astartes_TyranidLeaders", \\
	SpawnDistribution[0]=(Template="Astartes_CultHybrid", MinForceLevel=1, MaxForceLevel=4, MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[1]=(Template="Chryssalid",      MinForceLevel=2,  MaxForceLevel=9,  MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[2]=(Template="ChrysHybrid",     MinForceLevel=5,  MaxForceLevel=9,  MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[3]=(Template="CXDrone",         MinForceLevel=5,  MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[4]=(Template="CXInfector",      MinForceLevel=10, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[5]=(Template="CXBroodMother",   MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[6]=(Template="CXChameleon",     MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[7]=(Template="CXWarrior",       MinForceLevel=14, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[8]=(Template="CXHiveGuard",     MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[9]=(Template="CXShrieker",      MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[10]=(Template="CXJuvQueenM2",   MinForceLevel=12, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=4), \\
	SpawnDistribution[11]=(Template="CXJuvQueenM3",   MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=4))

+SpawnDistributionLists=(ListID="Astartes_TyranidFollowers", \\
	SpawnDistribution[0]=(Template="Astartes_CultHybrid", MinForceLevel=1, MaxForceLevel=4, MaxCharactersPerGroup=3, SpawnWeight=12), \\
	SpawnDistribution[1]=(Template="Faceless",        MinForceLevel=1,  MaxForceLevel=8,  MaxCharactersPerGroup=1, SpawnWeight=5), \\
	SpawnDistribution[2]=(Template="Chryssalid",      MinForceLevel=3,  MaxForceLevel=20, MaxCharactersPerGroup=3, SpawnWeight=8), \\
	SpawnDistribution[3]=(Template="ChrysZombie",     MinForceLevel=4,  MaxForceLevel=12, MaxCharactersPerGroup=3, SpawnWeight=6), \\
	SpawnDistribution[4]=(Template="ChrysHybrid",     MinForceLevel=5,  MaxForceLevel=9,  MaxCharactersPerGroup=3, SpawnWeight=12), \\
	SpawnDistribution[5]=(Template="CXRipperM1",      MinForceLevel=5,  MaxForceLevel=12, MaxCharactersPerGroup=4, SpawnWeight=10), \\
	SpawnDistribution[6]=(Template="CXDrone",         MinForceLevel=5,  MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[7]=(Template="CXRipperM2",      MinForceLevel=9,  MaxForceLevel=20, MaxCharactersPerGroup=4, SpawnWeight=10), \\
	SpawnDistribution[8]=(Template="CXInfector",      MinForceLevel=10, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=7), \\
	SpawnDistribution[9]=(Template="CXChameleon",     MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=6), \\
	SpawnDistribution[10]=(Template="CXBroodMother",  MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=5), \\
	SpawnDistribution[11]=(Template="CXWarrior",      MinForceLevel=14, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[12]=(Template="CXShrieker",     MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[13]=(Template="CXHiveGuard",    MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=6))

; Chaos (Black Legion mod = Chaos Marines from FL 3/5). Early game is the Cult: our Astartes_Cultist
; (armed human in civilian clothes, X2Character_Astartes) in numbers, led by a Chaos Marine from FL 1.
;   FL 1-4   Cult: cultists (Astartes_Cultist) led by a Chaos Marine or a cult leader
;   FL 3-9   first Chaos Marines (BL M1) led by Captains from FL 5
;   FL 10+   Black Legion proper
+SpawnDistributionLists=(ListID="Astartes_ChaosLeaders", \\
	SpawnDistribution[0]=(Template="Astartes_Cultist", MinForceLevel=1,  MaxForceLevel=4,  MaxCharactersPerGroup=1, SpawnWeight=6), \\
