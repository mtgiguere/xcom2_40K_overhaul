; Astartes spawn lists. These are our own leader/follower lists so a faction can cover the whole
; force-level range even when the source mod's lists start late. Templates that are not loaded
; (mod disabled) are skipped by the pod builder, so vanilla Chryssalid/Faceless keep Tyranid
; continents at least thematically right without The Hive.
;
; Tyranids (The Hive mod = Genestealer Cult + swarm):
;   FL 1-4   Genestealer Cult: hybrids (ChrysHybrid), infiltrators (Faceless), a few purestrains (Chryssalid)
;   FL 5-9   first bio-forms: rippers (CXRipperM1), drones (CXDrone), zombies (ChrysZombie)
;   FL 10+   the swarm: infectors, chameleons, brood mothers, warriors, shriekers, hive guard, juvenile queens
[XComGame.XComTacticalMissionManager]
+SpawnDistributionLists=(ListID="Astartes_TyranidLeaders", \\
	SpawnDistribution[0]=(Template="ChrysHybrid",     MinForceLevel=1,  MaxForceLevel=6,  MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[1]=(Template="Chryssalid",      MinForceLevel=2,  MaxForceLevel=9,  MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[2]=(Template="CXDrone",         MinForceLevel=5,  MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[3]=(Template="CXInfector",      MinForceLevel=10, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[4]=(Template="CXBroodMother",   MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[5]=(Template="CXChameleon",     MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[6]=(Template="CXWarrior",       MinForceLevel=14, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[7]=(Template="CXHiveGuard",     MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[8]=(Template="CXShrieker",      MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[9]=(Template="CXJuvQueenM2",    MinForceLevel=12, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=4), \\
	SpawnDistribution[10]=(Template="CXJuvQueenM3",   MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=4))

+SpawnDistributionLists=(ListID="Astartes_TyranidFollowers", \\
	SpawnDistribution[0]=(Template="ChrysHybrid",     MinForceLevel=1,  MaxForceLevel=9,  MaxCharactersPerGroup=3, SpawnWeight=12), \\
	SpawnDistribution[1]=(Template="Faceless",        MinForceLevel=1,  MaxForceLevel=8,  MaxCharactersPerGroup=1, SpawnWeight=5), \\
	SpawnDistribution[2]=(Template="Chryssalid",      MinForceLevel=3,  MaxForceLevel=20, MaxCharactersPerGroup=3, SpawnWeight=8), \\
	SpawnDistribution[3]=(Template="ChrysZombie",     MinForceLevel=4,  MaxForceLevel=12, MaxCharactersPerGroup=3, SpawnWeight=6), \\
	SpawnDistribution[4]=(Template="CXRipperM1",      MinForceLevel=5,  MaxForceLevel=12, MaxCharactersPerGroup=4, SpawnWeight=10), \\
	SpawnDistribution[5]=(Template="CXDrone",         MinForceLevel=5,  MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[6]=(Template="CXRipperM2",      MinForceLevel=9,  MaxForceLevel=20, MaxCharactersPerGroup=4, SpawnWeight=10), \\
	SpawnDistribution[7]=(Template="CXInfector",      MinForceLevel=10, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=7), \\
	SpawnDistribution[8]=(Template="CXChameleon",     MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=6), \\
	SpawnDistribution[9]=(Template="CXBroodMother",   MinForceLevel=12, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=5), \\
	SpawnDistribution[10]=(Template="CXWarrior",      MinForceLevel=14, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[11]=(Template="CXShrieker",     MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[12]=(Template="CXHiveGuard",    MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=6))

; Chaos (Black Legion mod = Chaos Marines from FL 3/5). Early game is the Cult: ADVENT troopers,
; priests and lancers stand in for cultists, demagogues and fanatics until proper cultist templates exist.
;   FL 1-4   Cult: cultists (AdvTrooper), demagogue (AdvPriest), fanatics (AdvStunLancer), cult leader (AdvCaptain)
;   FL 3-9   first Chaos Marines (BL M1) led by Captains from FL 5
;   FL 10+   Black Legion proper
+SpawnDistributionLists=(ListID="Astartes_ChaosLeaders", \\
	SpawnDistribution[0]=(Template="AdvCaptainM1",     MinForceLevel=1,  MaxForceLevel=4,  MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[1]=(Template="AdvPriestM1",      MinForceLevel=2,  MaxForceLevel=6,  MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[2]=(Template="BLMarineM1",       MinForceLevel=3,  MaxForceLevel=6,  MaxCharactersPerGroup=1, SpawnWeight=8), \\
	SpawnDistribution[3]=(Template="BLCaptainM1",      MinForceLevel=5,  MaxForceLevel=9,  MaxCharactersPerGroup=1, SpawnWeight=20), \\
	SpawnDistribution[4]=(Template="BLLordM1",         MinForceLevel=5,  MaxForceLevel=9,  MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[5]=(Template="BLCaptainM2",      MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=20), \\
	SpawnDistribution[6]=(Template="BLCaptainMeltaM2", MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[7]=(Template="BLLordM2",         MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[8]=(Template="BLCaptainM3",      MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=20), \\
	SpawnDistribution[9]=(Template="BLCaptainMeltaM3", MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=10), \\
	SpawnDistribution[10]=(Template="BLLordM3",        MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=10))

+SpawnDistributionLists=(ListID="Astartes_ChaosFollowers", \\
	SpawnDistribution[0]=(Template="AdvTrooperM1",          MinForceLevel=1,  MaxForceLevel=5,  MaxCharactersPerGroup=3, SpawnWeight=12), \\
	SpawnDistribution[1]=(Template="AdvStunLancerM1",       MinForceLevel=2,  MaxForceLevel=6,  MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[2]=(Template="AdvPriestM1",           MinForceLevel=3,  MaxForceLevel=7,  MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[3]=(Template="BLMarineM1",            MinForceLevel=3,  MaxForceLevel=9,  MaxCharactersPerGroup=2, SpawnWeight=10), \\
	SpawnDistribution[4]=(Template="BLMarineAssaultM1",     MinForceLevel=4,  MaxForceLevel=9,  MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[5]=(Template="BLRaptorM1",            MinForceLevel=4,  MaxForceLevel=9,  MaxCharactersPerGroup=2, SpawnWeight=6), \\
	SpawnDistribution[6]=(Template="BLFlameMarineM1",       MinForceLevel=5,  MaxForceLevel=9,  MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[7]=(Template="BLBerserkerM1",         MinForceLevel=5,  MaxForceLevel=9,  MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[8]=(Template="BLMarineM2",            MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=2, SpawnWeight=10), \\
	SpawnDistribution[9]=(Template="BLMarineMeltaM2",       MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[10]=(Template="BLMarineAssaultM2",    MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[11]=(Template="BLRaptorM2",           MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=2, SpawnWeight=6), \\
	SpawnDistribution[12]=(Template="BLFlameMarineM2",      MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=1, SpawnWeight=6), \\
	SpawnDistribution[13]=(Template="BLBerserkerM2",        MinForceLevel=10, MaxForceLevel=14, MaxCharactersPerGroup=2, SpawnWeight=8), \\
	SpawnDistribution[14]=(Template="BLMarineM3",           MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=2, SpawnWeight=10), \\
