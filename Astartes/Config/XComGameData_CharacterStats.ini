; Marine base stats. For now every recruit uses the vanilla 'Soldier' template, so this override
; makes all recruits Marines. Sisters and Officers get their own templates later (design.md 4.1).
; Vanilla for reference: HP 5, Offense 65, Mobility 12, Will 40 (+35 randomised), Strength 40.
[Soldier X2CharacterTemplate]
CharacterBaseStats[eStat_HP]=8
CharacterBaseStats[eStat_Offense]=65
CharacterBaseStats[eStat_Mobility]=12
CharacterBaseStats[eStat_Will]=55
CharacterBaseStats[eStat_Strength]=70
CharacterBaseStats[eStat_Hacking]=5
-RandomizedBaseStats=(StatType=eStat_Will, StatAmount=35, RandStatAmount=16)
+RandomizedBaseStats=(StatType=eStat_Will, StatAmount=50, RandStatAmount=10)

