[XComGame.XGAIBehavior]
; Open the Warp is aimed like a grenade: at the spot that catches the most Marines within its radius.
+AoEProfiles=(Profile=Astartes_RiftProfile, Ability=Astartes_OpenTheWarp, MinTargets=1, bFailOnFriendlyFire=0)

[XComGame.X2AIBTBehaviorTree]
; Chaos Sorcerer (Astartes_UnitVariants): on red alert he opens the Warp if he can, otherwise he fights like the
; Black Legion captain he was cloned from (BlackLegion mod's tree).
+Behaviors=(BehaviorName="Astartes_ChaosSorcerer::CharacterRoot", NodeType=Selector, Child[0]=TryJob, Child[1]=GenericGreenMovement, Child[2]=Astartes_Sorcerer_RedAlert, Child[3]=GenericAlertHandler)
+Behaviors=(BehaviorName=Astartes_Sorcerer_RedAlert, NodeType=Sequence, Child[0]=IsRedAlert, Child[1]=Astartes_Sorcerer_RedSelector)
+Behaviors=(BehaviorName=Astartes_Sorcerer_RedSelector, NodeType=Selector, Child[0]=Astartes_TryOpenTheWarp, Child[1]=BlackLegionCaptain_RedAbilitySelector)
+Behaviors=(BehaviorName=Astartes_TryOpenTheWarp, NodeType=Sequence, Child[0]=IsAbilityAvailable-Astartes_OpenTheWarp, Child[1]=FindPotentialAoETargets-Astartes_RiftProfile, Child[2]=SelectAoETarget-Astartes_RiftProfile, Child[3]=SelectAbility-Astartes_OpenTheWarp)
+Behaviors=(BehaviorName=IsAbilityAvailable-Astartes_OpenTheWarp, NodeType=Condition)
+Behaviors=(BehaviorName=FindPotentialAoETargets-Astartes_RiftProfile, NodeType=Action)
+Behaviors=(BehaviorName=SelectAoETarget-Astartes_RiftProfile, NodeType=Action)
+Behaviors=(BehaviorName=SelectAbility-Astartes_OpenTheWarp, NodeType=Action)

; Fanatic melee (lesser daemons, the Autarch): playtest 2026-10-18 found the Black Legion berserker tree hiding in cover
; every other turn. This is the vanilla ADVENT Berserker's shape on the generic melee nodes: dash and strike, else close in.
+Behaviors=(BehaviorName="Astartes_MeleeFanatic::CharacterRoot", NodeType=Selector, Child[0]=TryJobUnsafe, Child[1]=GenericGreenMovement, Child[2]=Astartes_MeleeFanatic_RedAlert, Child[3]=GenericAlertHandler)
+Behaviors=(BehaviorName=Astartes_MeleeFanatic_RedAlert, NodeType=Sequence, Child[0]=IsRedAlert, Child[1]=Astartes_MeleeFanatic_Selector)
+Behaviors=(BehaviorName=Astartes_MeleeFanatic_Selector, NodeType=Selector, Child[0]=TryStandardMeleeDashFANATICUnsafe, Child[1]=TryStandardMeleeFANATICUnsafe, Child[2]=MoveMeleeDashFANATICUnsafe, Child[3]=HuntEnemyUnsafe)

; Eldar Warlock: on red alert he tries Horrify (vanilla Mindspin nodes), then Protect (vanilla Stasis nodes), then fights like
; a Dark Eldar leader (DarkEldar_Raiders' tree) with his Singing Spear.
+Behaviors=(BehaviorName="Astartes_EldarWarlock::CharacterRoot", NodeType=Selector, Child[0]=TryJob, Child[1]=GenericGreenMovement, Child[2]=Astartes_Warlock_RedAlert, Child[3]=GenericAlertHandler)
+Behaviors=(BehaviorName=Astartes_Warlock_RedAlert, NodeType=Sequence, Child[0]=IsRedAlert, Child[1]=Astartes_Warlock_RedSelector)
+Behaviors=(BehaviorName=Astartes_Warlock_RedSelector, NodeType=Selector, Child[0]=TryMindSpinOption, Child[1]=TryStasis, Child[2]=DarkEldarLeaderRedAbilitySelector)
