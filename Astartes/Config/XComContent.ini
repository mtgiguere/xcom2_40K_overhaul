; Body parts registered by this mod.
; A character template whose appearance assembles its pawn (bAppearanceDefinesPawn) finds the pawn through
; "Pawn" body parts tagged with its own template name. Without these the unit spawns without a pawn (invisible).
[XComGame.X2BodyPartTemplateManager]
; Chaos Cultist: the standard human soldier pawn; clothes come from the civilian-militia appearance.
+BodyPartTemplateConfig=(PartType="Pawn", TemplateName="Astartes_Cultist_M", ArchetypeName="GameUnit_XComSoldier.ARC_Soldier_M", Gender=eGender_Male,   bVeteran=false, ArmorTemplate="", CharacterTemplate="Astartes_Cultist")
+BodyPartTemplateConfig=(PartType="Pawn", TemplateName="Astartes_Cultist_F", ArchetypeName="GameUnit_XComSoldier.ARC_Soldier_F", Gender=eGender_Female, bVeteran=false, ArmorTemplate="", CharacterTemplate="Astartes_Cultist")
