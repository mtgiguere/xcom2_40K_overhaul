+HideDonorItems="Holocron_MG"
+HideDonorItems="Holocron_BM"
; The Mechanicus power axe worn by the crozius: its own item stays out of our armoury.
+HideDonorItems="40kAdMec_MechanicusPowerAxe_CV"
+HideDonorItems="40kAdMec_MechanicusPowerAxe_MG"
+HideDonorItems="40kAdMec_MechanicusPowerAxe_BM"
; Vanilla pistols carry no standard shot (the Sharpshooter class adds it). A bolt pistol can always be fired.
+ExtraAbilities=(Weapon="Astartes_BoltPistol_CV", Ability="PistolStandardShot")
+ExtraAbilities=(Weapon="Astartes_BoltPistol_MG", Ability="PistolStandardShot")
+ExtraAbilities=(Weapon="Astartes_BoltPistol_BM", Ability="PistolStandardShot")
+ExtraAbilities=(Weapon="Astartes_PlasmaPistol_CV", Ability="PistolStandardShot")
+ExtraAbilities=(Weapon="Astartes_PlasmaPistol_MG", Ability="PistolStandardShot")
+ExtraAbilities=(Weapon="Astartes_PlasmaPistol_BM", Ability="PistolStandardShot")
[Astartes.Astartes_FactionConfig]
; Continent faction ownership (design.md 7.1b). Each continent is dealt one of these factions at
; campaign start; every enemy pod on that continent is rebuilt from the faction's spawn lists.
bEnableContinentFactions=true

; FactionName: our name for it. LeaderList / FollowerList: SpawnDistributionList IDs (ours or the faction mod's).
; CommanderList: leaders for "commander" encounters (objective targets like Neutralize Field Commander).
; RequiredDLC: the mod's DLCIdentifier; if its lists are not loaded the pod is left vanilla and a log line says so.
+Factions=(FactionName="Orks",     LeaderList="OrkRaiderTeamOneLeaders", FollowerList="OrkRaiderTeamOneFollowers", CommanderList="Astartes_OrkCommanders",     RequiredDLC="OrkRaiders")
+Factions=(FactionName="Chaos",    LeaderList="Astartes_ChaosLeaders",   FollowerList="Astartes_ChaosFollowers",   CommanderList="Astartes_ChaosCommanders",   RequiredDLC="BlackLegion")
; Eldar hold no territory (decision 2026-10-18): they come through the webway as incursions, the Lost mechanic reworked
; (design.md 9.2). Their spawn lists (Astartes_EldarLeaders / Commanders, DarkEldarRaidersFollowers) serve that system.
;+Factions=(FactionName="Eldar",    LeaderList="Astartes_EldarLeaders",   FollowerList="DarkEldarRaidersFollowers", CommanderList="Astartes_EldarCommanders",   RequiredDLC="DarkEldar_Raiders")
; Webway incursions (the Lost reworked): every Lost pod and Lost swarm (encounter IDs starting TheLost) becomes an Eldar pod
; on the alien team, on any continent, at most IncursionMaxPodSize strong. Without the Eldar mods the Lost stay the Lost.
bEnableIncursions=true
Incursion=(FactionName="Eldar", LeaderList="Astartes_EldarLeaders", FollowerList="Astartes_EldarFollowers", CommanderList="Astartes_EldarCommanders", RequiredDLC="DarkEldar_Raiders")
+IncursionEncounterPrefixes="TheLost"
IncursionMaxPodSize=5
; How an incursion swarm arrives: PsiGate = the game's portal (the webway opens); empty = the Lost's run-in from the map edge.
IncursionArrival="PsiGate"
+Factions=(FactionName="Tyranids", LeaderList="Astartes_TyranidLeaders", FollowerList="Astartes_TyranidFollowers", CommanderList="Astartes_TyranidCommanders", RequiredDLC="TheHive")

; Fixed assignments for testing. Empty = random at campaign start.
; Continent template names: Continent_NorthAmerica, Continent_SouthAmerica, Continent_Europe,
; Continent_Africa, Continent_Asia, Continent_Oceania.
;+ContinentFactionOverrides=(Continent="Continent_NorthAmerica", FactionName="Chaos")
;+ContinentFactionOverrides=(Continent="Continent_Africa",       FactionName="Orks")

; Pods with a strategy unit tag (Chosen, VIPs) are never replaced. These encounter IDs are never replaced either:
+NeverRewriteEncounters="SPCx1_Faceless"
+NeverRewriteEncounters="SPCx1_SwarmVIPSoldier"
; A Chaos Sorcerer's rift brings daemons on any continent (also covered by the Astartes_ prefix rule in code).
+NeverRewriteEncounters="Astartes_DaemonRift_Lesser"
+NeverRewriteEncounters="Astartes_DaemonRift_Greater"
; A Chaos Sorcerer's rift brings daemons on any continent (also covered by the Astartes_ prefix rule in code).
+NeverRewriteEncounters="Astartes_DaemonRift_Lesser"
+NeverRewriteEncounters="Astartes_DaemonRift_Greater"
; Encounters whose ID starts with these prefixes are "commander" groups (e.g. Neutralize Field Commander):
; their leader comes from the faction's CommanderList so the objective target is a real faction leader.
+CommanderEncounterPrefixes="SPCx"
; Raid SitReps the faction mods add on their own. Removed from missions on continents we own, so a Chaos
; continent does not suddenly get an Ork war-band dropped on it by someone else's dice.
+ForeignRaidSitReps="OrkTeamOneRaiders"
+ForeignRaidSitReps="OrkTeamTwoRaiders"
+ForeignRaidSitReps="OrksVsOrksRaiders"
+ForeignRaidSitReps="BlackLegion"
+ForeignRaidSitReps="DarkEldarRaiders"
bLogPodRewrites=true
; Daemons in Chaos pods (appended at load only if the G-Virus-based variants exist, see Astartes_UnitVariants).
+DaemonSpawns=(ListID="Astartes_ChaosFollowers",  Template="Astartes_Daemon",        MinForceLevel=9,  MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8)
+DaemonSpawns=(ListID="Astartes_ChaosLeaders",    Template="Astartes_GreaterDaemon", MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=6)
; The Chaos Sorcerer leads pods from force level 6.
+DaemonSpawns=(ListID="Astartes_ChaosLeaders",    Template="Astartes_ChaosSorcerer",  MinForceLevel=6,  MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=12)
+DaemonSpawns=(ListID="Astartes_ChaosCommanders", Template="Astartes_ChaosSorcerer",  MinForceLevel=6,  MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8)
; The Chaos Champion leads from force level 10.
+DaemonSpawns=(ListID="Astartes_ChaosLeaders",    Template="Astartes_ChaosChampion",  MinForceLevel=10, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=10)
+DaemonSpawns=(ListID="Astartes_ChaosCommanders", Template="Astartes_ChaosChampion",  MinForceLevel=10, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=12)
+DaemonSpawns=(ListID="Astartes_ChaosCommanders", Template="Astartes_GreaterDaemon", MinForceLevel=15, MaxForceLevel=20, MaxCharactersPerGroup=1, SpawnWeight=8)

[Astartes.Astartes_UnitVariants]
; Variants: our own template cloned from another mod's, with OUR stats from XComGameData_CharacterStats.ini.
; Skipped (with a log line) when the base mod is not loaded.
+Variants=(NewName="Astartes_CultHybrid", BaseTemplate="ChrysHybrid", CharacterGroup="Astartes_CultHybrid")
; Daemons: the Resident Evil 2 G-Virus mod (RE2_GVirus_Beta, workshop 2264204537) ships the G-forms as full
; enemy units with their own AI and attacks. Its G3 is our Greater Daemon, its G2 our (lesser) Daemon.
; CharacterGroup is left as the base so the mod's AI behaviour trees (keyed by group) still drive them.
+Variants=(NewName="Astartes_GreaterDaemon", BaseTemplate="BirkinG3_T1")
; Lesser daemons (2026-10-18): Black Legion berserker frames (melee AI; the chain-axe alone, no bolter, as a hellblade) dressed as Fallout
; deathclaws (Fallout_Deathclaws, 3358025333). The G-Virus G3 stays the Greater Daemon.
+Variants=(NewName="Astartes_Daemon",        BaseTemplate="BLBerserkerM1", LoadoutOverride="Astartes_Daemon_Loadout", CharacterGroup="Astartes_Daemon", bAppearanceDefinesPawn=true, CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
; Chaos Champion: a Black Legion lord frame wearing Skorge (GOW4_Skorge, 3558395254). Leads late Chaos pods.
+Variants=(NewName="Astartes_ChaosChampion", BaseTemplate="BLLordM1",      CharacterGroup="Astartes_ChaosChampion", bAppearanceDefinesPawn=true, CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
; Daemon Prince: the RE3 Nemesis Prototype mod's stage-2 Nemesis (workshop 2400021624), melee, ruler-style AI. The form a
; possessed Librarian takes (PerilsDaemons). CharacterGroup kept so the mod's AI tree drives it.
+Variants=(NewName="Astartes_DaemonPrince",  BaseTemplate="Nemesis_T2")
; Eldar Warlock: the first craftworld unit. A soldier body dressed in the EldarArmor mod's Warlock plate by
; Astartes_CharGen_Dressed (Looks below), the Black Legion captain's enemy frame, a Destructor (Force Shove rifle:
; knockback, stun on hit and on overwatch) and the Dark Eldar leader's fighting AI.
; Powers: Horrify (vanilla Mindspin: panic / disorient / brief control) and Protect (vanilla Stasis on an ally), both with
; vanilla AI nodes; the psi amp in his loadout carries the casting animations. He rolls the Perils of the Warp too.
+Variants=(NewName="Astartes_EldarWarlock",  BaseTemplate="BLCaptainM1", LoadoutOverride="Astartes_EldarWarlock_Loadout", CharacterGroup="Astartes_EldarWarlock", BehaviorTree="Astartes_EldarWarlock::CharacterRoot", bAppearanceDefinesPawn=true, CharacterGenerator="Astartes.Astartes_CharGen_Dressed", ExtraAbilities[0]="Mindspin", ExtraAbilities[1]="Stasis", ExtraAbilities[2]="Astartes_PerilsOfTheWarp")
; Craftworld infantry: Guardians (militia with shuriken catapults) and Dire Avengers (the aspect warriors). Black Legion line
; marine frames in EldarArmor plate, the marine's own shooting AI, the EldarWeapons mod's catapults.
; Imperial heroes (design.md 9.1f): clones of Soldier created as their hero class, dressed by Looks below.
+Variants=(NewName="Astartes_Canoness",  BaseTemplate="Soldier", LoadoutOverride="SquaddieAstartes_Canoness",  DefaultSoldierClass="Astartes_Canoness",  CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
+Variants=(NewName="Astartes_Commissar", BaseTemplate="Soldier", LoadoutOverride="SquaddieAstartes_Commissar", DefaultSoldierClass="Astartes_Commissar", CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
; Eldar Autarch: the incursion's war-leader. A berserker frame (melee AI) in Overpharah's winged armour (2841395404) with the
; psionic_swordman mod's psi-blade and its reactive powers: deflect, reflect, counter-guard, precognition (3725158285).
+Variants=(NewName="Astartes_EldarAutarch",  BaseTemplate="BLBerserkerM1", LoadoutOverride="Astartes_EldarAutarch_Loadout", CharacterGroup="Astartes_EldarAutarch", bAppearanceDefinesPawn=true, CharacterGenerator="Astartes.Astartes_CharGen_Dressed", ExtraAbilities[0]="PsiSwordFocusPool", ExtraAbilities[1]="PsiSwordDeflect", ExtraAbilities[2]="PsiSwordReflect", ExtraAbilities[3]="PsiSwordCounterGuard", ExtraAbilities[4]="PsiSwordPrecognition")
; Inquisitor (design.md 9.1e): a hero, never a faction reward; arrives through the Taint judgement (not built yet) or Astartes_GiveHero.
+Variants=(NewName="Astartes_Inquisitor",    BaseTemplate="Soldier", LoadoutOverride="SquaddieAstartes_Inquisitor", DefaultSoldierClass="Astartes_Inquisitor", CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
+Variants=(NewName="Astartes_EldarGuardian", BaseTemplate="BLMarineM1", LoadoutOverride="Astartes_EldarGuardian_Loadout", CharacterGroup="Astartes_EldarGuardian", bAppearanceDefinesPawn=true, CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
+Variants=(NewName="Astartes_DireAvenger",   BaseTemplate="BLMarineM1", LoadoutOverride="Astartes_DireAvenger_Loadout",   CharacterGroup="Astartes_DireAvenger",   bAppearanceDefinesPawn=true, CharacterGenerator="Astartes.Astartes_CharGen_Dressed")
; Chaos Sorcerer: a Black Legion captain (BlackLegion mod) with Warpfire for a gun, Open the Warp and the Perils of the Warp.
