+Variants=(NewName="Astartes_ChaosSorcerer", BaseTemplate="BLCaptainM1", LoadoutOverride="Astartes_ChaosSorcerer_Loadout", CharacterGroup="Astartes_ChaosSorcerer", BehaviorTree="Astartes_ChaosSorcerer::CharacterRoot", ExtraAbilities[0]="Astartes_OpenTheWarp", ExtraAbilities[1]="Astartes_PerilsOfTheWarp")

[Astartes.X2Ability_Astartes_Librarian]
; Perils of the Warp (docs/classes.md, Librarian). Every psychic power rolls after it resolves.
; Chance (percent) = BASE + (WarpCharge - 1) * PER_WARP_CHARGE - the Psychic Hood's protection.
PERILS_BASE_CHANCE=8
PERILS_CHANCE_PER_WARP_CHARGE=6
PERILS_HOOD_REDUCTION_MG=3
PERILS_HOOD_REDUCTION_BM=6
; Outcome weights (relative). Possession is the rarest by design: with these numbers a minor power
; drags the Librarian into the Warp 0.8% of the time, a cataclysmic one 2%.
PERILS_WEIGHT_WARP_SURGE=1
PERILS_WEIGHT_BACKLASH=3
PERILS_WEIGHT_WARP_SHOCK=3
PERILS_WEIGHT_MENTAL_PURGE=2
PERILS_WEIGHT_POSSESSION=1
; Psychic Backlash damage (ignores armour) and spread; Warp Shock stun length (actions); Mental Purge cooldown (turns).
PERILS_BACKLASH_DAMAGE=3
PERILS_BACKLASH_SPREAD=1
PERILS_SHOCK_STUN_ACTIONS=2
PERILS_PURGE_COOLDOWN=3
; The daemon that bursts from a possessed Librarian. By decision (2026-10-17) it is a GREATER daemon from
; mission one: that is the point of Chaos. Vanilla Gatekeeper stands in until a daemon model is wired in.
; Tiers are supported (the entry with the highest MinForceLevel at or below the current force level wins),
; so a gentler player can scale it. bWearsTheLibrarian makes the daemon wear his body (a possessed husk). Example:
;+PerilsDaemons=(MinForceLevel=1,  Template="PsiZombieHuman", bWearsTheLibrarian=true)
;+PerilsDaemons=(MinForceLevel=6,  Template="Spectre")
;+PerilsDaemons=(MinForceLevel=11, Template="Archon")
; Entries whose template is not loaded are skipped; on a tie the later entry wins, so list the fallback first.
+PerilsDaemons=(MinForceLevel=1, Template="Gatekeeper")
+PerilsDaemons=(MinForceLevel=1, Template="Astartes_GreaterDaemon")
; The possessed Librarian's own form: a Daemon Prince (RE3 Nemesis Prototype mod), so what tears out of a brother is not
; the same beast a Sorcerer's rift lets through. Falls back to the Greater Daemon above when that mod is absent.
+PerilsDaemons=(MinForceLevel=1, Template="Astartes_DaemonPrince")
bLogPerils=true
; Warp Charge per power: 1 = minor, 2 = major, 3 = cataclysmic. Powers not listed never roll.
+PsychicPowers=(Ability="Soulfire",             WarpCharge=1)
+PsychicPowers=(Ability="Insanity",           WarpCharge=1)
+PsychicPowers=(Ability="Inspire",        WarpCharge=1)
+PsychicPowers=(Ability="Solace",     WarpCharge=1)
+PsychicPowers=(Ability="Fuse",                       WarpCharge=1)
+PsychicPowers=(Ability="EnergyShield",    WarpCharge=1)
+PsychicPowers=(Ability="ForceLightning",      WarpCharge=2)
+PsychicPowers=(Ability="ForceChoke",          WarpCharge=2)
+PsychicPowers=(Ability="ForcePush",           WarpCharge=1)
+PsychicPowers=(Ability="ForceHeal",           WarpCharge=1)
+PsychicPowers=(Ability="ForceChainLightning", WarpCharge=3)
+PsychicPowers=(Ability="NullLance",       WarpCharge=2)
+PsychicPowers=(Ability="Schism",     WarpCharge=2)
+PsychicPowers=(Ability="SoulSteal",        WarpCharge=2)
+PsychicPowers=(Ability="Domination",          WarpCharge=3)
+PsychicPowers=(Ability="VoidRift", WarpCharge=3)
; The Chaos Sorcerer's rift is a psychic power too: Chaos is as dangerous to its own.
+PsychicPowers=(Ability="Astartes_OpenTheWarp", WarpCharge=3)
; The Eldar Warlock's runes: Horrify (Mindspin) and Protect (Stasis). Slaanesh is always listening.
+PsychicPowers=(Ability="Mindspin", WarpCharge=2)
+PsychicPowers=(Ability="Stasis", WarpCharge=1)

[Astartes.Astartes_ChapterMaster]
; Unique seats (design.md 4.4): one holder each, appointed from a Marine of at least this rank (7 = the top rank).
CHAPTER_MASTER_MIN_RANK=7
; Seat rules. RequiredClass restricts the seat to one class; ExcludedClasses bars classes; Ability is the relic granted
; (or, with bCapstoneByClass, the Capstones entry for the holder's class). Nickname is given when the Marine has none.
+Seats=(Seat="ChapterMaster",    Title="Chapter Master",     Nickname="Chapter Master",     bCapstoneByClass=true, ExcludedClasses[0]="Astartes_Librarian", ExcludedClasses[1]="Astartes_Chaplain")
+Seats=(Seat="ChiefLibrarian",   Title="Chief Librarian",    Nickname="Chief Librarian",    RequiredClass="Astartes_Librarian", Ability="Astartes_WarpMastery")
+Seats=(Seat="MasterOfSanctity", Title="Master of Sanctity", Nickname="Master of Sanctity", RequiredClass="Astartes_Chaplain",  Ability="Astartes_LitanyOfTheDevout")
; Chapter Master relic by origin class. Classes not listed are appointed without a relic, for now.
+Capstones=(SoldierClass="Astartes_Assault",    Ability="Astartes_DeathIncarnate")
+Capstones=(SoldierClass="Astartes_Tactical",   Ability="Astartes_RitesOfBattle")
