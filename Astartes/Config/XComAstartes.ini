; Astartes gameplay tuning. Read by classes declared config(Astartes).

[Astartes.X2Ability_Astartes]
; Geneseed added to the Chapter pool per harvested battle-brother.
GENESEED_PER_RECOVERY=1
; How far (in tiles) an Apothecary can reach a body. 1 = adjacent (including diagonals).
GENESEED_RECOVERY_RANGE_TILES=1
; Power Armour Mk VII = vanilla KevlarArmor with these bonuses (the armour packs bind their parts to the
; vanilla armour names, so the vanilla tiers are the power armour marks). Vanilla kevlar gives nothing.
POWER_ARMOUR_HEALTH_BONUS=2
POWER_ARMOUR_MITIGATION=1

[Astartes.X2Ability_Astartes_Tactical]
; Bolter Drill: standard bolter shots refunded (do not end the turn) this many times per turn.
BOLTER_DRILL_REFUNDS_PER_TURN=1
; Kraken Rounds: bolter damage / armour piercing / aim change.
KRAKEN_DAMAGE=1
KRAKEN_PIERCE=2
KRAKEN_AIM=-10
; Hellfire Rounds: vs organic targets.
HELLFIRE_DAMAGE=2
HELLFIRE_SHRED=1
; Executioner: bolter hits on targets at or below this % HP become crits, this many times per turn.
EXECUTIONER_HP_PERCENT=50
EXECUTIONER_CRITS_PER_TURN=1
; Rally: grant an ally an action; charges per mission; range in tiles.
RALLY_CHARGES=1
RALLY_RANGE_TILES=4
; Inspire: remove disorient/panic/stun/daze from allies within radius (tiles); cooldown (turns).
INSPIRE_RADIUS_TILES=6
INSPIRE_COOLDOWN=4
; For the Emperor: every ally within radius regains an action; charges per mission.
FOR_THE_EMPEROR_RADIUS_TILES=8
FOR_THE_EMPEROR_CHARGES=1
; Tactical Doctrine: squad mobility bonus. Hold the Line: squad defence bonus while in full cover.
TACTICAL_DOCTRINE_MOBILITY=1
HOLD_THE_LINE_DEFENSE=10
; Chapter Banner: squad Will bonus (also lowers the Librarian's Perils chance, see PERILS_BANNER_REDUCTION).
CHAPTER_BANNER_WILL=20
; Combat Squads: uses per mission.
COMBAT_SQUADS_CHARGES=1
; Rites of Battle (Chapter Master capstone): radius (tiles) and aim bonus for the turn.
RITES_OF_BATTLE_RADIUS_TILES=10
RITES_OF_BATTLE_AIM=20

[Astartes.X2Ability_Astartes_Assault]
; Chain Teeth: extra chainsword damage.
CHAIN_TEETH_DAMAGE=2
; Whirlwind: melee kills refund the action, this many times per turn.
WHIRLWIND_REFUNDS_PER_TURN=2
; Power Armour Veteran: HP regenerated per turn, and the cap per mission.
POWER_ARMOUR_VETERAN_REGEN=1
POWER_ARMOUR_VETERAN_MAX_PER_MISSION=6
; Duelist: chainsword armour piercing and crit chance bonus.
DUELIST_PIERCE=3
DUELIST_CRIT=20
; Decapitate: cooldown in turns.
DECAPITATE_COOLDOWN=4
; Charge: melee crit / damage bonus after moving this turn.
CHARGE_CRIT=25
CHARGE_DAMAGE=1
; Shock Landing: enemies within this radius (meters; 1 tile = 1.5 m) of a jump landing are disoriented.
SHOCK_LANDING_RADIUS_METERS=2.5
; Hold Fast: melee attacks against the Marine lose this much to-hit.
HOLD_FAST_DEFENSE=25
; Hammer of Wrath: melee bonus on the turn the Marine lands from a jump.
HAMMER_OF_WRATH_DAMAGE=3
HAMMER_OF_WRATH_SHRED=2
; Angel of Death: actions restored and mobility bonus for the turn (once per mission).
ANGEL_OF_DEATH_ACTIONS=2
ANGEL_OF_DEATH_MOBILITY=4
; Jump visualization: leap, flight along a ballistic arc, landing. The animations must be authored WITHOUT root motion
; (vanilla climb/fall animations have it and drag the pawn to the world origin). Default: the Jedi Class Revised mod's
; Force Jump set (workshop 2031929512), used when that mod is enabled; without it the Marine flies the arc unanimated.
JUMP_ANIM_START="HL_ForceJumpStart"
JUMP_ANIM_LOOP="HL_ForceJumpLoop"
JUMP_ANIM_STOP="HL_ForceJumpStop"
JUMP_START_PLAYRATE=1.5
JUMP_STOP_PLAYRATE=1.2
; Fraction of the leap animation played before the pawn leaves the ground.
JUMP_START_FRACTION=0.45
; Arc shape: apex height above the higher end (in floors), and flight time per tile clamped to a range (seconds).
JUMP_ARC_HEIGHT_TILES=2.5
JUMP_SECONDS_PER_TILE=0.07
JUMP_MIN_FLIGHT_SECONDS=0.6
JUMP_MAX_FLIGHT_SECONDS=1.6
; Seconds before touchdown at which the landing animation starts.
JUMP_LANDING_LEAD=0.35
; Ignition sound (SoundCue path) and the animation set (object path, no class prefix). Both from Jedi Class Revised by default.
; Jump pack sound and flame: the Alien Hunters Icarus Suit's Wwise events and particles (vanilla DLC content, no mod
; needed). Thrusters ride the first bone of JUMP_THRUSTER_BONES the pawn has (offsets in that bone's frame); the soldier
; skeleton's exoSuit_Backpack bone (the EXO/WAR suit's pack mount, playtest 2026-10-18) sits on the back, Spine1 is the
; fallback. With none present they attach to the pawn and the log lists the torso bones it does have.
JUMP_TAKEOFF_SOUND="DLC_60_SoundCharacterFX.IcarusJump_Burst_On"
JUMP_FLIGHT_SOUND="DLC_60_SoundCharacterFX.IcarusJump_High_Air"
JUMP_LAND_SOUND="DLC_60_SoundCharacterFX.IcarusJetLand"
JUMP_TAKEOFF_FX="DLC_2_FX_Icarus_Suit.P_Launch"
JUMP_LAND_FX="DLC_2_FX_Icarus_Suit.P_Hover_Burst"
+JUMP_THRUSTERS=(FX="DLC_2_FX_Icarus_Suit.P_Thruster_Main_L", Offset=(X=0, Y=-9, Z=0))
+JUMP_THRUSTERS=(FX="DLC_2_FX_Icarus_Suit.P_Thruster_Main_R", Offset=(X=0, Y=9, Z=0))
+JUMP_THRUSTER_BONES="exoSuit_Backpack"
+JUMP_THRUSTER_BONES="Spine1"
; Optional extra SoundCue on ignition (empty = none). Was the Jedi Class Revised cue; the Icarus events replace it.
JUMP_SOUND_CUE=""
JUMP_ANIMSET_PATH="JediClassAbilities.Anims.AS_ForcePowers"
; Abilities that use the arc visualization.
+JumpAbilities="IcarusJump"
+JumpAbilities="Astartes_DeepJump"

[Astartes.X2Ability_Astartes_Devastator]
; Brace: heavy weapon aim bonus when the Devastator has not moved this turn.
BRACE_AIM=15
; Bipod: reaction-fire aim bonus from an unmoved position (vanilla overwatch penalty is about -30%).
BIPOD_REACTION_AIM=20
; Tank Hunter: vs targets with at least this much armour.
TANK_HUNTER_MIN_ARMOUR=1
TANK_HUNTER_CRIT=25
TANK_HUNTER_DAMAGE=1
; Plasma Overcharge: heavy-weapon damage bonus this turn; cooldown (turns).
PLASMA_OVERCHARGE_DAMAGE=3
PLASMA_OVERCHARGE_COOLDOWN=3
; Lascannon Round: charges per mission, armour piercing, damage bonus.
LASCANNON_CHARGES=2
LASCANNON_PIERCE=5
LASCANNON_DAMAGE=2
; Heavy Stance: unmoved heavy-weapon shots that do not end the turn, per turn.
HEAVY_STANCE_REFUNDS_PER_TURN=1
; Krak Missile: cooldown, damage and piercing bonus.
KRAK_MISSILE_COOLDOWN=3
KRAK_MISSILE_DAMAGE=2
KRAK_MISSILE_PIERCE=3
; Weapon Mount: armour and defence while the Devastator has not moved this turn.
WEAPON_MOUNT_ARMOUR=2
WEAPON_MOUNT_DEFENSE=10
; Melta Round: charges, maximum range (tiles), damage and piercing bonus.
MELTA_CHARGES=2
MELTA_RANGE_TILES=4
MELTA_DAMAGE=3
MELTA_PIERCE=10
; Orbital Bombardment (Chapter Master capstone): range and blast radius (tiles), damage/spread/pierce, cover destruction,
; number of shell explosions in the barrage and the interval between them (seconds), and the explosion effect.
ORBITAL_RANGE_TILES=30
ORBITAL_RADIUS_TILES=3
ORBITAL_DAMAGE=8
ORBITAL_SPREAD=2
ORBITAL_PIERCE=3
ORBITAL_ENVIRONMENT_DAMAGE=200
ORBITAL_SHELLS=4
ORBITAL_SHELL_INTERVAL=0.35
ORBITAL_EXPLOSION_EFFECT="FX_Explosion_Grenade_Launcher.P_Grenade_Launcher_Explosion"

[Astartes.X2Ability_Astartes_Apothecary]
; Stimm Shot: free move for an ally; cooldown (turns), range (tiles).
STIMM_SHOT_COOLDOWN=3
STIMM_SHOT_RANGE_TILES=4
; Field Surgery: extra narthecium heal charges. Reductor Mastery: extra geneseed per recovery.
FIELD_SURGERY_CHARGES=1
REDUCTOR_MASTERY_BONUS_GENESEED=1
; The Emperor's Mercy (Chapter Master capstone): radius (tiles) and HP healed.
EMPERORS_MERCY_RADIUS_TILES=10
EMPERORS_MERCY_HEAL=20

[Astartes.Astartes_AbilityVariants]
; Clones: our own name on a copy of a vanilla ability. Only for abilities with no perk visual effects bound to their
; name (the game binds those by ability name, so a clone loses them). Loc blocks use the clone's name.
; Deep Jump: the long jump. Twice the range, a turn more cooldown (teleport-style visual, like Icarus Jump).
+Clones=(NewName="Astartes_DeepJump", BaseAbility="IcarusJump", Cooldown=3, bRemoveCharges=true, ActionPoints=1, bEndsTurn=false, RangeTiles=28, bNoRulerReaction=true)
; Retunes: vanilla abilities changed in place and renamed through localization overrides ([Soulfire X2AbilityTemplate] = Smite...).
; Assault Jump Pack = Icarus Jump: one action that does not end the turn (jump, then chainsword), no per-mission
; charges, 2-turn cooldown, 14 tiles, and the Alien Ruler free-move reaction removed.
+Retunes=(BaseAbility="IcarusJump",   Cooldown=2, bRemoveCharges=true, ActionPoints=1, bEndsTurn=false, RangeTiles=14, bNoRulerReaction=true, bClearPrerequisites=true)
; Tactical Codex Volley = Faceoff on the bolter: one shot at every visible enemy, once per mission.
+Retunes=(BaseAbility="Faceoff",      Cooldown=0, Charges=1, ActionPoints=1, bEndsTurn=true, bClearPrerequisites=true)
; Librarian Telekine Shield = the Shieldbearer's energy shield, on a cooldown.
+Retunes=(BaseAbility="EnergyShield", Cooldown=4, bClearPrerequisites=true)
; Librarian disciplines keep their vanilla implementation; only prerequisites go (our tree is the progression).
+Retunes=(BaseAbility="Soulfire",   bClearPrerequisites=true)
+Retunes=(BaseAbility="Insanity",   bClearPrerequisites=true)
+Retunes=(BaseAbility="Inspire",    bClearPrerequisites=true)
+Retunes=(BaseAbility="NullLance",  bClearPrerequisites=true)
+Retunes=(BaseAbility="Schism",     bClearPrerequisites=true)
+Retunes=(BaseAbility="Solace",     bClearPrerequisites=true)
+Retunes=(BaseAbility="SoulSteal",  bClearPrerequisites=true)
+Retunes=(BaseAbility="Domination", bClearPrerequisites=true)
+Retunes=(BaseAbility="VoidRift",   bClearPrerequisites=true)
+Retunes=(BaseAbility="Fuse",       bClearPrerequisites=true)
; Librarian powers from Jedi Class Revised (optional): used directly under 40K names so their perk visuals work;
; the Jedi Force-point cost is stripped. Absent that mod, the Fallbacks below fill the slots with vanilla stand-ins.
+Retunes=(BaseAbility="ForceLightning", bRemoveOtherCosts=true, bClearPrerequisites=true)
+Retunes=(BaseAbility="ForceChoke", bRemoveOtherCosts=true, bClearPrerequisites=true)
+Retunes=(BaseAbility="ForcePush", bRemoveOtherCosts=true, bClearPrerequisites=true)
+Retunes=(BaseAbility="ForceHeal", bRemoveOtherCosts=true, bClearPrerequisites=true)
+Retunes=(BaseAbility="ForceChainLightning", bRemoveOtherCosts=true, bClearPrerequisites=true)
+Fallbacks=(Ability="ForceLightning", Fallback="Bladestorm")
+Fallbacks=(Ability="ForceChoke", Fallback="LightningReflexes")
+Fallbacks=(Ability="ForcePush", Fallback="Shadowstrike")
+Fallbacks=(Ability="ForceHeal", Fallback="Implacable")
+Fallbacks=(Ability="ForceChainLightning", Fallback="Blademaster")

[Astartes.Astartes_ClassLook]
; Head gear forced on promotion into a class (the generator cannot know the class at recruit time).
; Librarians wear the psychic hood: the Tacticus pack has a tintable hood helmet.
+ClassHelmets=(SoldierClass="Astartes_Librarian", Helmet="Helmet_Tank_Hood_tint")
; Chaplains wear the skull helm (Space Marine 2 Chaplain Armor, workshop 3454751781; skipped with a log line if absent).
+ClassHelmets=(SoldierClass="Astartes_Chaplain", Helmet="Helmet_Chaplain_bare")
; Rank grants: a Chaplain who reaches rank 7 is a Reclusiarch and gains Purge the Unclean.
+RankGrants=(SoldierClass="Astartes_Chaplain", Rank=7, Ability="Astartes_PurgeTheUnclean")

[Astartes.X2Item_AstartesWeapons]
; Imperial wargear = vanilla weapon clones (meshes/anims/upgrades kept) with 40K names and a Marine tune.
; Tiers follow the vanilla research chain: CV = Mk I pattern, MG = Mk II, BM = relic/master-crafted.
; MeshFrom: the model each weapon wears, from the Space Marine Armory mod (SpaceMarineArmory, workshop 3656755854):
; the Space Marine 2 weapon set, same art family as the Tacticus armour. Vanilla look if that mod is not loaded.
; Bolter (rifle slot): hits harder than a rifle, smaller magazine.
+Weapons=(NewName="Astartes_Bolter_CV",       BaseTemplate="AssaultRifle_CV", BaseItem="",                     DamageBonus=1, ClipSizeOverride=3, MeshFrom="WP_BoltRifle")
+Weapons=(NewName="Astartes_Bolter_MG",       BaseTemplate="AssaultRifle_MG", BaseItem="Astartes_Bolter_CV",   DamageBonus=1, ClipSizeOverride=3, MeshFrom="WP_BoltRifle_MG")
+Weapons=(NewName="Astartes_Bolter_BM",       BaseTemplate="AssaultRifle_BM", BaseItem="Astartes_Bolter_MG",   DamageBonus=1, ClipSizeOverride=3, MeshFrom="WP_BoltRifle_BM")
; Bolt pistol (pistol slot; Primary Secondaries makes Astartes_BoltPistol_CV_Primary etc.)
+Weapons=(NewName="Astartes_BoltPistol_CV",   BaseTemplate="Pistol_CV",       BaseItem="",                       DamageBonus=1, MeshFrom="WP_BoltPistol")
+Weapons=(NewName="Astartes_BoltPistol_MG",   BaseTemplate="Pistol_MG",       BaseItem="Astartes_BoltPistol_CV", DamageBonus=1, MeshFrom="WP_BoltPistol_MG")
+Weapons=(NewName="Astartes_BoltPistol_BM",   BaseTemplate="Pistol_BM",       BaseItem="Astartes_BoltPistol_MG", DamageBonus=1, MeshFrom="WP_BoltPistol_BM")
; Chainsword -> power sword -> relic blade (sword slot; _Primary variants for the Assault Marine)
+Weapons=(NewName="Astartes_Chainsword_CV",   BaseTemplate="Sword_CV",        BaseItem="",                       DamageBonus=1, MeshFrom="WP_Chainsword")
+Weapons=(NewName="Astartes_Chainsword_MG",   BaseTemplate="Sword_MG",        BaseItem="Astartes_Chainsword_CV", DamageBonus=1, MeshFrom="WP_PowerSword_MG")
+Weapons=(NewName="Astartes_Chainsword_BM",   BaseTemplate="Sword_BM",        BaseItem="Astartes_Chainsword_MG", DamageBonus=1, MeshFrom="WP_PowerSword_BM")
; Heavy bolter (cannon slot) for Devastators
+Weapons=(NewName="Astartes_HeavyBolter_CV",  BaseTemplate="Cannon_CV",       BaseItem="",                        DamageBonus=1, MeshFrom="WP_HeavyBolter")
+Weapons=(NewName="Astartes_HeavyBolter_MG",  BaseTemplate="Cannon_MG",       BaseItem="Astartes_HeavyBolter_CV", DamageBonus=1, MeshFrom="WP_HeavyBolter_MG")
+Weapons=(NewName="Astartes_HeavyBolter_BM",  BaseTemplate="Cannon_BM",       BaseItem="Astartes_HeavyBolter_MG", DamageBonus=1, MeshFrom="WP_HeavyBolter_BM")
; Force sword (sword slot; _Primary variant for the Librarian)
+Weapons=(NewName="Astartes_ForceSword_CV",   BaseTemplate="Sword_CV",        BaseItem="",                       DamageBonus=0, MeshFrom="WP_PowerSword")
+Weapons=(NewName="Astartes_ForceSword_MG",   BaseTemplate="Sword_MG",        BaseItem="Astartes_ForceSword_CV", DamageBonus=0, MeshFrom="WP_PowerSword_MG")
+Weapons=(NewName="Astartes_ForceSword_BM",   BaseTemplate="Sword_BM",        BaseItem="Astartes_ForceSword_MG", DamageBonus=0, MeshFrom="WP_PowerSword_BM")
; Psychic hood: the Librarian's psi focus, in its own Highlander slot (eInvSlot_PsiAmp, Astartes_ItemSlots) so he also
; carries a bolt pistol. The hood itself is head gear.
+Weapons=(NewName="Astartes_PsychicHood_CV",  BaseTemplate="PsiAmp_CV",       BaseItem="", SlotOverride=eInvSlot_PsiAmp)
+Weapons=(NewName="Astartes_PsychicHood_MG",  BaseTemplate="PsiAmp_MG",       BaseItem="Astartes_PsychicHood_CV", SlotOverride=eInvSlot_PsiAmp)
+Weapons=(NewName="Astartes_PsychicHood_BM",  BaseTemplate="PsiAmp_BM",       BaseItem="Astartes_PsychicHood_MG", SlotOverride=eInvSlot_PsiAmp)
; Narthecium: the Apothecary's gremlin-slot tool (servo-skull look later)
+Weapons=(NewName="Astartes_Narthecium_CV",   BaseTemplate="Gremlin_CV",      BaseItem="")
+Weapons=(NewName="Astartes_Narthecium_MG",   BaseTemplate="Gremlin_MG",      BaseItem="Astartes_Narthecium_CV")
+Weapons=(NewName="Astartes_Narthecium_BM",   BaseTemplate="Gremlin_BM",      BaseItem="Astartes_Narthecium_MG")
; Plasma gun (rifle slot, Tactical/Apothecary option): hits much harder, small magazine, less accurate. Models from
; 40KPlasmagunMod (workshop 1499457957); plasma pistol models from 40KPlasmaPistolsMod (1497538465).
+Weapons=(NewName="Astartes_PlasmaGun_CV",    BaseTemplate="AssaultRifle_CV", BaseItem="",                        DamageBonus=3, ClipSizeOverride=2, AimBonus=-5, MeshFrom="PLASMAGUN_CV")
+Weapons=(NewName="Astartes_PlasmaGun_MG",    BaseTemplate="AssaultRifle_MG", BaseItem="Astartes_PlasmaGun_CV",   DamageBonus=3, ClipSizeOverride=2, AimBonus=-5, MeshFrom="PLASMAGUN_MG")
+Weapons=(NewName="Astartes_PlasmaGun_BM",    BaseTemplate="AssaultRifle_BM", BaseItem="Astartes_PlasmaGun_MG",   DamageBonus=3, ClipSizeOverride=2, AimBonus=-5, MeshFrom="PLASMAGUN_BM")
+Weapons=(NewName="Astartes_PlasmaPistol_CV", BaseTemplate="Pistol_CV",       BaseItem="",                        DamageBonus=2, ClipSizeOverride=2, MeshFrom="PLASMAPISTOL_CV")
+Weapons=(NewName="Astartes_PlasmaPistol_MG", BaseTemplate="Pistol_MG",       BaseItem="Astartes_PlasmaPistol_CV", DamageBonus=2, ClipSizeOverride=2, MeshFrom="PLASMAPISTOL_MG")
+Weapons=(NewName="Astartes_PlasmaPistol_BM", BaseTemplate="Pistol_BM",       BaseItem="Astartes_PlasmaPistol_MG", DamageBonus=2, ClipSizeOverride=2, MeshFrom="PLASMAPISTOL_BM")
; Crozius arcanum (sword slot; _Primary variant for the Chaplain): a power maul. Wears the 40K Mechanicus mod's power axe
; (workshop 1943761564). Alternatives, one line each: 40kAdMec_OmnissianPowerAxe_CV (cog head) or TheAxeMod's Axe_CV.
+Weapons=(NewName="Astartes_Crozius_CV", BaseTemplate="Sword_CV", BaseItem="",                     DamageBonus=2, MeshFrom="40kAdMec_MechanicusPowerAxe_CV")
+Weapons=(NewName="Astartes_Crozius_MG", BaseTemplate="Sword_MG", BaseItem="Astartes_Crozius_CV", DamageBonus=2, MeshFrom="40kAdMec_MechanicusPowerAxe_MG")
+Weapons=(NewName="Astartes_Crozius_BM", BaseTemplate="Sword_BM", BaseItem="Astartes_Crozius_MG", DamageBonus=2, MeshFrom="40kAdMec_MechanicusPowerAxe_BM")
; Warpfire: the Chaos Sorcerer's hand-cast lightning (Imperial Surplus Force Weapons, workshop 2171892934). Enemy only.
+Weapons=(NewName="Astartes_WarpLightning", BaseTemplate="ForceLightning_MG", BaseItem="", DamageBonus=1, bEnemyOnly=true)
; Destructor: the Eldar Warlock's telekinetic shove (Force Weapons' Force Shove rifle: stun 80% on hit, also on overwatch).
; StandardShot is added so the enemy AI fires it like a gun (the mod's own shot ability has no AI nodes).
; The shove weapon has no model (Force Weapons casts from empty hands), so it wears the EldarWeapons mod's Singing Spear.
+Weapons=(NewName="Astartes_Destructor", BaseTemplate="ForcePush_MG", BaseItem="", DamageBonus=1, bEnemyOnly=true, MeshFrom="SingingSpear_MG")
+ExtraAbilities=(Weapon="Astartes_Destructor", Ability="StandardShot")
; Shuriken catapults (EldarWeapons' Dire Avenger catapult): the Guardian's and the Dire Avenger's rifles. Enemy only.
+Weapons=(NewName="Astartes_ShurikenCatapult", BaseTemplate="AVENGERSHURIKENCATAPULT_CV", BaseItem="", DamageBonus=0, bEnemyOnly=true)
+Weapons=(NewName="Astartes_AvengerCatapult",  BaseTemplate="AVENGERSHURIKENCATAPULT_MG", BaseItem="", DamageBonus=0, bEnemyOnly=true)
; Donor weapons whose looks we borrowed (and the rest of their packs) are hidden from the armoury and Build Items,
; so the player sees our Bolter, Chainsword and Heavy Bolter only. Skipped when a pack is not loaded.
+HideDonorItems="BOLTER_CV"
+HideDonorItems="BOLTER_MG"
+HideDonorItems="BOLTER_BM"
+HideDonorItems="BOLTPISTOL_CV"
+HideDonorItems="BOLTPISTOL_MG"
+HideDonorItems="BOLTPISTOL_BM"
+HideDonorItems="WP_BoltRifle"
+HideDonorItems="WP_BoltRifle_MG"
+HideDonorItems="WP_BoltRifle_BM"
+HideDonorItems="WP_AutoBolter"
+HideDonorItems="WP_AutoBolter_MG"
+HideDonorItems="WP_AutoBolter_BM"
+HideDonorItems="WP_BoltPistol"
+HideDonorItems="WP_BoltPistol_MG"
+HideDonorItems="WP_BoltPistol_BM"
+HideDonorItems="WP_BoltSniperRifle"
+HideDonorItems="WP_BoltSniperRifle_MG"
+HideDonorItems="WP_BoltSniperRifle_BM"
+HideDonorItems="WP_HeavyBolter"
