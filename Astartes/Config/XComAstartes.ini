+HideDonorItems="SingingSpear_CV"
+HideDonorItems="SingingSpear_MG"
+HideDonorItems="SingingSpear_BM"
+HideDonorItems="AVENGERSHURIKENCATAPULT_CV"
+HideDonorItems="AVENGERSHURIKENCATAPULT_MG"
+HideDonorItems="AVENGERSHURIKENCATAPULT_BM"
; psionic_swordman: the psi-blades are the Autarch's
+HideDonorItems="PSIBlade_CV_Primary"
+HideDonorItems="PSIBlade_MG_Primary"
+HideDonorItems="PSIBlade_BM_Primary"
+HideDonorItems="PLASMAGUN_CV"
+HideDonorItems="PLASMAGUN_MG"
+HideDonorItems="PLASMAGUN_BM"
+HideDonorItems="PLASMAPISTOL_CV"
+HideDonorItems="PLASMAPISTOL_MG"
+HideDonorItems="PLASMAPISTOL_BM"
; Jedi Class Revised is enabled only for its jump animations: its gear stays out of the armoury and Build Items.
+HideDonorItems="Lightsaber_CV"
+HideDonorItems="Lightsaber_MG"
