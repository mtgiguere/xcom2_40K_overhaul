; Astartes gameplay tuning. Read by classes declared config(Astartes).

[Astartes.X2Ability_Astartes]
; Geneseed added to the Chapter pool per harvested battle-brother.
GENESEED_PER_RECOVERY=1
; How far (in tiles) an Apothecary can reach a body. 1 = adjacent (including diagonals).
GENESEED_RECOVERY_RANGE_TILES=1
; Power Armour Mk VII = vanilla KevlarArmor with these bonuses (the armour packs bind their parts to the
; vanilla armour names, so the vanilla tiers are the power armour marks). Vanilla kevlar gives nothing.
POWER_ARMOUR_HEALTH_BONUS=2
POWER_ARMOUR_MITIGATION=1

[Astartes.X2Ability_Astartes_Tactical]
; Bolter Drill: standard bolter shots refunded (do not end the turn) this many times per turn.
BOLTER_DRILL_REFUNDS_PER_TURN=1
; Kraken Rounds: bolter damage / armour piercing / aim change.
KRAKEN_DAMAGE=1
KRAKEN_PIERCE=2
KRAKEN_AIM=-10
; Hellfire Rounds: vs organic targets.
HELLFIRE_DAMAGE=2
HELLFIRE_SHRED=1
; Executioner: bolter hits on targets at or below this % HP become crits, this many times per turn.
EXECUTIONER_HP_PERCENT=50
EXECUTIONER_CRITS_PER_TURN=1
; Rally: grant an ally an action; charges per mission; range in tiles.
RALLY_CHARGES=1
RALLY_RANGE_TILES=4
; Inspire: remove disorient/panic/stun/daze from allies within radius (tiles); cooldown (turns).
INSPIRE_RADIUS_TILES=6
INSPIRE_COOLDOWN=4
; For the Emperor: every ally within radius regains an action; charges per mission.
FOR_THE_EMPEROR_RADIUS_TILES=8
FOR_THE_EMPEROR_CHARGES=1

[Astartes.X2Ability_Astartes_Assault]
; Chain Teeth: extra chainsword damage.
CHAIN_TEETH_DAMAGE=2
; Whirlwind: melee kills refund the action, this many times per turn.
WHIRLWIND_REFUNDS_PER_TURN=2
; Power Armour Veteran: HP regenerated per turn, and the cap per mission.
POWER_ARMOUR_VETERAN_REGEN=1
POWER_ARMOUR_VETERAN_MAX_PER_MISSION=6
; Duelist: chainsword armour piercing and crit chance bonus.
DUELIST_PIERCE=3
DUELIST_CRIT=20
; Decapitate: cooldown in turns.
DECAPITATE_COOLDOWN=4

[Astartes.X2Ability_Astartes_Devastator]
; Brace: heavy weapon aim bonus when the Devastator has not moved this turn.
BRACE_AIM=15
; Bipod: reaction-fire aim bonus from an unmoved position (vanilla overwatch penalty is about -30%).
BIPOD_REACTION_AIM=20
; Tank Hunter: vs targets with at least this much armour.
TANK_HUNTER_MIN_ARMOUR=1
TANK_HUNTER_CRIT=25
TANK_HUNTER_DAMAGE=1

[Astartes.X2Ability_Astartes_Apothecary]
; Stimm Shot: free move for an ally; cooldown (turns), range (tiles).
STIMM_SHOT_COOLDOWN=3
STIMM_SHOT_RANGE_TILES=4

[Astartes.Astartes_AbilityVariants]
; Librarian disciplines as clones of vanilla psionic abilities (own names/descriptions; proven implementations).
; Pyromancy
+Clones=(NewName="Astartes_Smite",              BaseAbility="Soulfire")
+Clones=(NewName="Astartes_FlameBreath",        BaseAbility="NullLance")
+Clones=(NewName="Astartes_MoltenBeam",         BaseAbility="SoulSteal")
+Clones=(NewName="Astartes_FuryOfTheAncients",  BaseAbility="VoidRift")
; Telepathy
+Clones=(NewName="Astartes_Terrify",            BaseAbility="Insanity")
+Clones=(NewName="Astartes_PsychicScream",      BaseAbility="Schism")
+Clones=(NewName="Astartes_Dominate",           BaseAbility="Domination")
; Biomancy
+Clones=(NewName="Astartes_Quickening",         BaseAbility="Inspire")
+Clones=(NewName="Astartes_MightOfHeroes",      BaseAbility="Solace")

[Astartes.Astartes_ClassLook]
; Head gear forced on promotion into a class (the generator cannot know the class at recruit time).
; Librarians wear the psychic hood: the Tacticus pack has a tintable hood helmet.
+ClassHelmets=(SoldierClass="Astartes_Librarian", Helmet="Helmet_Tank_Hood_tint")

[Astartes.X2Item_AstartesWeapons]
; Imperial wargear = vanilla weapon clones (meshes/anims/upgrades kept) with 40K names and a Marine tune.
; Tiers follow the vanilla research chain: CV = Mk I pattern, MG = Mk II, BM = relic/master-crafted.
; Bolter (rifle slot): hits harder than a rifle, smaller magazine.
+Weapons=(NewName="Astartes_Bolter_CV",       BaseTemplate="AssaultRifle_CV", BaseItem="",                     DamageBonus=1, ClipSizeOverride=3)
+Weapons=(NewName="Astartes_Bolter_MG",       BaseTemplate="AssaultRifle_MG", BaseItem="Astartes_Bolter_CV",   DamageBonus=1, ClipSizeOverride=3)
+Weapons=(NewName="Astartes_Bolter_BM",       BaseTemplate="AssaultRifle_BM", BaseItem="Astartes_Bolter_MG",   DamageBonus=1, ClipSizeOverride=3)
; Bolt pistol (pistol slot; Primary Secondaries makes Astartes_BoltPistol_CV_Primary etc.)
+Weapons=(NewName="Astartes_BoltPistol_CV",   BaseTemplate="Pistol_CV",       BaseItem="",                       DamageBonus=1)
+Weapons=(NewName="Astartes_BoltPistol_MG",   BaseTemplate="Pistol_MG",       BaseItem="Astartes_BoltPistol_CV", DamageBonus=1)
+Weapons=(NewName="Astartes_BoltPistol_BM",   BaseTemplate="Pistol_BM",       BaseItem="Astartes_BoltPistol_MG", DamageBonus=1)
; Chainsword -> power sword -> relic blade (sword slot; _Primary variants for the Assault Marine)
+Weapons=(NewName="Astartes_Chainsword_CV",   BaseTemplate="Sword_CV",        BaseItem="",                       DamageBonus=1)
+Weapons=(NewName="Astartes_Chainsword_MG",   BaseTemplate="Sword_MG",        BaseItem="Astartes_Chainsword_CV", DamageBonus=1)
+Weapons=(NewName="Astartes_Chainsword_BM",   BaseTemplate="Sword_BM",        BaseItem="Astartes_Chainsword_MG", DamageBonus=1)
; Heavy bolter (cannon slot) for Devastators
+Weapons=(NewName="Astartes_HeavyBolter_CV",  BaseTemplate="Cannon_CV",       BaseItem="",                        DamageBonus=1)
+Weapons=(NewName="Astartes_HeavyBolter_MG",  BaseTemplate="Cannon_MG",       BaseItem="Astartes_HeavyBolter_CV", DamageBonus=1)
+Weapons=(NewName="Astartes_HeavyBolter_BM",  BaseTemplate="Cannon_BM",       BaseItem="Astartes_HeavyBolter_MG", DamageBonus=1)
; Force sword (sword slot; _Primary variant for the Librarian)
+Weapons=(NewName="Astartes_ForceSword_CV",   BaseTemplate="Sword_CV",        BaseItem="",                       DamageBonus=0)
+Weapons=(NewName="Astartes_ForceSword_MG",   BaseTemplate="Sword_MG",        BaseItem="Astartes_ForceSword_CV", DamageBonus=0)
+Weapons=(NewName="Astartes_ForceSword_BM",   BaseTemplate="Sword_BM",        BaseItem="Astartes_ForceSword_MG", DamageBonus=0)
; Psychic hood: the psi-amp slot item that lets a Librarian use his powers (the hood itself is head gear)
+Weapons=(NewName="Astartes_PsychicHood_CV",  BaseTemplate="PsiAmp_CV",       BaseItem="")
+Weapons=(NewName="Astartes_PsychicHood_MG",  BaseTemplate="PsiAmp_MG",       BaseItem="Astartes_PsychicHood_CV")
+Weapons=(NewName="Astartes_PsychicHood_BM",  BaseTemplate="PsiAmp_BM",       BaseItem="Astartes_PsychicHood_MG")
; Narthecium: the Apothecary's gremlin-slot tool (servo-skull look later)
+Weapons=(NewName="Astartes_Narthecium_CV",   BaseTemplate="Gremlin_CV",      BaseItem="")
+Weapons=(NewName="Astartes_Narthecium_MG",   BaseTemplate="Gremlin_MG",      BaseItem="Astartes_Narthecium_CV")
+Weapons=(NewName="Astartes_Narthecium_BM",   BaseTemplate="Gremlin_BM",      BaseItem="Astartes_Narthecium_MG")

[Astartes.Astartes_FactionConfig]
; Continent faction ownership (design.md 7.1b). Each continent is dealt one of these factions at
; campaign start; every enemy pod on that continent is rebuilt from the faction's spawn lists.
bEnableContinentFactions=true

; FactionName: our name for it. LeaderList / FollowerList: SpawnDistributionList IDs (ours or the faction mod's).
; CommanderList: leaders for "commander" encounters (objective targets like Neutralize Field Commander).
; RequiredDLC: the mod's DLCIdentifier; if its lists are not loaded the pod is left vanilla and a log line says so.
+Factions=(FactionName="Orks",     LeaderList="OrkRaiderTeamOneLeaders", FollowerList="OrkRaiderTeamOneFollowers", CommanderList="Astartes_OrkCommanders",     RequiredDLC="OrkRaiders")
+Factions=(FactionName="Chaos",    LeaderList="Astartes_ChaosLeaders",   FollowerList="Astartes_ChaosFollowers",   CommanderList="Astartes_ChaosCommanders",   RequiredDLC="BlackLegion")
+Factions=(FactionName="Tyranids", LeaderList="Astartes_TyranidLeaders", FollowerList="Astartes_TyranidFollowers", CommanderList="Astartes_TyranidCommanders", RequiredDLC="TheHive")

; Fixed assignments for testing. Empty = random at campaign start.
; Continent template names: Continent_NorthAmerica, Continent_SouthAmerica, Continent_Europe,
; Continent_Africa, Continent_Asia, Continent_Oceania.
;+ContinentFactionOverrides=(Continent="Continent_NorthAmerica", FactionName="Chaos")
;+ContinentFactionOverrides=(Continent="Continent_Africa",       FactionName="Orks")

; Pods with a strategy unit tag (Chosen, VIPs) are never replaced. These encounter IDs are never replaced either:
+NeverRewriteEncounters="SPCx1_Faceless"
+NeverRewriteEncounters="SPCx1_SwarmVIPSoldier"
; Encounters whose ID starts with these prefixes are "commander" groups (e.g. Neutralize Field Commander):
; their leader comes from the faction's CommanderList so the objective target is a real faction leader.
+CommanderEncounterPrefixes="SPCx"
; Raid SitReps the faction mods add on their own. Removed from missions on continents we own, so a Chaos
; continent does not suddenly get an Ork war-band dropped on it by someone else's dice.
+ForeignRaidSitReps="OrkTeamOneRaiders"
+ForeignRaidSitReps="OrkTeamTwoRaiders"
+ForeignRaidSitReps="OrksVsOrksRaiders"
+ForeignRaidSitReps="BlackLegion"
+ForeignRaidSitReps="DarkEldarRaiders"
bLogPodRewrites=true

[Astartes.Astartes_UnitVariants]
; Variants: our own template cloned from another mod's, with OUR stats from XComGameData_CharacterStats.ini.
; Skipped (with a log line) when the base mod is not loaded.
+Variants=(NewName="Astartes_CultHybrid", BaseTemplate="ChrysHybrid", CharacterGroup="Astartes_CultHybrid")
; Daemons: the Resident Evil 2 G-Virus mod (RE2_GVirus_Beta, workshop 2264204537) ships the G-forms as full
; enemy units with their own AI and attacks. Its G3 is our Greater Daemon, its G2 our (lesser) Daemon.
; CharacterGroup is left as the base so the mod's AI behaviour trees (keyed by group) still drive them.
+Variants=(NewName="Astartes_GreaterDaemon", BaseTemplate="BirkinG3_T1")
+Variants=(NewName="Astartes_Daemon",        BaseTemplate="BirkinG2_T1")

[Astartes.X2Ability_Astartes_Librarian]
; Perils of the Warp (docs/classes.md, Librarian). Every psychic power rolls after it resolves.
; Chance (percent) = BASE + (WarpCharge - 1) * PER_WARP_CHARGE - the Psychic Hood's protection.
PERILS_BASE_CHANCE=8
PERILS_CHANCE_PER_WARP_CHARGE=6
PERILS_HOOD_REDUCTION_MG=3
PERILS_HOOD_REDUCTION_BM=6
; Outcome weights (relative). Possession is the rarest by design: with these numbers a minor power
; drags the Librarian into the Warp 0.8% of the time, a cataclysmic one 2%.
PERILS_WEIGHT_WARP_SURGE=1
PERILS_WEIGHT_BACKLASH=3
PERILS_WEIGHT_WARP_SHOCK=3
PERILS_WEIGHT_MENTAL_PURGE=2
PERILS_WEIGHT_POSSESSION=1
; Psychic Backlash damage (ignores armour) and spread; Warp Shock stun length (actions); Mental Purge cooldown (turns).
PERILS_BACKLASH_DAMAGE=3
PERILS_BACKLASH_SPREAD=1
PERILS_SHOCK_STUN_ACTIONS=2
PERILS_PURGE_COOLDOWN=3
; The daemon that bursts from a possessed Librarian. By decision (2026-10-17) it is a GREATER daemon from
; mission one: that is the point of Chaos. Vanilla Gatekeeper stands in until a daemon model is wired in.
; Tiers are supported (the entry with the highest MinForceLevel at or below the current force level wins),
; so a gentler player can scale it. bWearsTheLibrarian makes the daemon wear his body (a possessed husk). Example:
;+PerilsDaemons=(MinForceLevel=1,  Template="PsiZombieHuman", bWearsTheLibrarian=true)
;+PerilsDaemons=(MinForceLevel=6,  Template="Spectre")
;+PerilsDaemons=(MinForceLevel=11, Template="Archon")
; Entries whose template is not loaded are skipped; on a tie the later entry wins, so list the fallback first.
+PerilsDaemons=(MinForceLevel=1, Template="Gatekeeper")
+PerilsDaemons=(MinForceLevel=1, Template="Astartes_GreaterDaemon")
bLogPerils=true
; Warp Charge per power: 1 = minor, 2 = major, 3 = cataclysmic. Powers not listed never roll.
+PsychicPowers=(Ability="Astartes_Smite",             WarpCharge=1)
+PsychicPowers=(Ability="Astartes_Terrify",           WarpCharge=1)
+PsychicPowers=(Ability="Astartes_Quickening",        WarpCharge=1)
+PsychicPowers=(Ability="Astartes_MightOfHeroes",     WarpCharge=1)
+PsychicPowers=(Ability="Fuse",                       WarpCharge=1)
+PsychicPowers=(Ability="Astartes_FlameBreath",       WarpCharge=2)
+PsychicPowers=(Ability="Astartes_PsychicScream",     WarpCharge=2)
+PsychicPowers=(Ability="Astartes_MoltenBeam",        WarpCharge=2)
+PsychicPowers=(Ability="Astartes_Dominate",          WarpCharge=3)
+PsychicPowers=(Ability="Astartes_FuryOfTheAncients", WarpCharge=3)
