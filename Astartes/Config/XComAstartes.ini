+HideDonorItems="WP_PowerSword_MG"
+HideDonorItems="WP_PowerSword_BM"
; Imperial Surplus Force Weapons: enemy psyker gear, not XCOM's
+HideDonorItems="ForceLightning_CV"
+HideDonorItems="ForceLightning_MG"
+HideDonorItems="ForceLightning_BM"
+HideDonorItems="ForceShock_CV"
+HideDonorItems="ForceShock_MG"
